<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAM FOR CARS | لوحة تحكم الإدارة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #050505; color: white; -webkit-tap-highlight-color: transparent; }
        .gold-border { border-color: rgba(212, 175, 55, 0.3); }
        .gold-text { color: #d4af37; }
        .card-box {
            background: linear-gradient(145deg, #0d0d0d, #060606);
            border: 1px solid rgba(255, 255, 255, 0.07);
            box-shadow: 0 15px 35px -10px rgba(0, 0, 0, 0.9);
        }
        .custom-input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 12px;
            background-color: #121212;
            border: 1px solid rgba(212, 175, 55, 0.25);
            color: white;
            font-size: 13px;
            outline: none;
            transition: all 0.3s ease;
        }
        .custom-input:focus {
            border-color: #d4af37;
            box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.15);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-[#d4af37] selection:text-black">

    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen" class="fixed inset-0 z-50 bg-black flex items-center justify-center p-4">
        <div class="card-box p-8 rounded-3xl border gold-border w-full max-w-md text-center space-y-6">
            <div class="w-16 h-16 bg-[#d4af37]/10 border gold-border rounded-2xl flex items-center justify-center mx-auto text-[#d4af37] text-2xl font-black">
                YAM
            </div>
            <div class="space-y-1">
                <h1 class="text-lg font-black text-white">لوحة تحكم معرض يام</h1>
                <p class="text-xs text-neutral-400">الرجاء إدخال رمز المرور الخاص بالإدارة</p>
            </div>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <input type="password" id="admin-pass" placeholder="كلمة المرور" class="custom-input text-center font-mono tracking-widest text-base" required>
                <button type="submit" class="w-full py-3 bg-gradient-to-r from-[#d4af37] to-[#aa8c2c] text-black font-black text-xs rounded-xl shadow-lg hover:opacity-90 transition-all">
                    تسجيل الدخول
                </button>
            </form>
        </div>
    </div>

    <!-- لوحة التحكم الرئيسية -->
    <div id="admin-dashboard" class="flex-1 flex flex-col hidden">
        <!-- هيدر الإدارة -->
        <header class="bg-black/95 border-b gold-border h-20 px-4 sm:px-8 flex items-center justify-between sticky top-0 z-40 backdrop-blur-md">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-2xl bg-[#d4af37]/10 border gold-border flex items-center justify-center text-[#d4af37] text-xl font-black">
                    YAM
                </div>
                <div>
                    <h1 class="text-sm sm:text-base font-black tracking-wider block">لوحة تحكم الإدارة</h1>
                    <span class="text-[10px] gold-text font-semibold tracking-widest block">الشيخ/عماد رسلان</span>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="toggleMaintenance()" id="maintenance-btn" class="px-3 py-2 bg-neutral-900 border gold-border text-xs text-neutral-300 rounded-xl flex items-center gap-2 hover:border-amber-400 transition-all">
                    <i class="fa-solid fa-power-off text-amber-400"></i> <span id="maintenance-text">وضع الصيانة</span>
                </button>
                <button onclick="logoutAdmin()" class="px-3 py-2 bg-red-500/10 border border-red-500/30 text-xs text-red-400 rounded-xl hover:bg-red-500 hover:text-white transition-all">
                    <i class="fa-solid fa-right-from-bracket"></i> خروج
                </button>
            </div>
        </header>

        <!-- محتوى الإدارة -->
        <main class="flex-1 max-w-5xl mx-auto w-full p-4 sm:p-6 space-y-6 my-6">
            
            <!-- قسم الإحصائيات السريعة -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div class="card-box p-4 rounded-2xl border gold-border flex items-center justify-between">
                    <div>
                        <span class="text-[10px] text-neutral-400 block">إجمالي السيارات</span>
                        <h3 id="stat-total-cars" class="text-xl font-black font-mono gold-text">0</h3>
                    </div>
                    <div class="w-10 h-10 rounded-xl bg-[#d4af37]/10 border gold-border flex items-center justify-center text-[#d4af37]">
                        <i class="fa-solid fa-car"></i>
                    </div>
                </div>
                <div class="card-box p-4 rounded-2xl border gold-border flex items-center justify-between">
                    <div>
                        <span class="text-[10px] text-neutral-400 block">إجمالي زيارات الموقع</span>
                        <h3 id="stat-total-visits" class="text-xl font-black font-mono gold-text">0</h3>
                    </div>
                    <div class="w-10 h-10 rounded-xl bg-[#d4af37]/10 border gold-border flex items-center justify-center text-[#d4af37]">
                        <i class="fa-solid fa-eye"></i>
                    </div>
                </div>
                <div class="card-box p-4 rounded-2xl border gold-border flex items-center justify-between">
                    <div>
                        <span class="text-[10px] text-neutral-400 block">إجمالي مشاهدات السيارات</span>
                        <h3 id="stat-car-views" class="text-xl font-black font-mono gold-text">0</h3>
                    </div>
                    <div class="w-10 h-10 rounded-xl bg-[#d4af37]/10 border gold-border flex items-center justify-center text-[#d4af37]">
                        <i class="fa-solid fa-chart-line"></i>
                    </div>
                </div>
            </div>

            <!-- نموذج إضافة أو تعديل سيارة -->
            <div class="card-box p-6 rounded-3xl border gold-border space-y-4">
                <div class="flex items-center justify-between pb-3 border-b gold-border">
                    <h2 id="form-mode-title" class="text-sm font-black text-white">إضافة سيارة جديدة للمعرض</h2>
                    <button id="cancel-edit-btn" onclick="resetCarForm()" class="text-xs text-red-400 hover:underline hidden">إلغاء التعديل</button>
                </div>

                <form onsubmit="saveCarData(event)" class="space-y-4">
                    <input type="hidden" id="edit-car-id">
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[10px] text-neutral-400 mb-1">عنوان السيارة وموديلها</label>
                            <input type="text" id="car-title" placeholder="مثال: Mercedes S500 2026" required class="custom-input text-xs">
                        </div>
                        <div>
                            <label class="block text-[10px] text-neutral-400 mb-1">السعر النهائي (ريال)</label>
                            <input type="number" id="car-price" placeholder="مثال: 450000" required class="custom-input text-xs font-mono">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-4 gap-3">
                        <div>
                            <label class="block text-[10px] text-neutral-400 mb-1">القسم والسوق</label>
                            <select id="car-market" class="custom-input text-xs" required>
                                <option value="used">قسم السيارات المستعملة</option>
                                <option value="new">قسم السيارات الجديدة (وكالة)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] text-neutral-400 mb-1">سنة الصنع (الموديل)</label>
                            <input type="text" id="car-year" placeholder="2026" required class="custom-input text-xs font-mono">
                        </div>
                        <div>
                            <label class="block text-[10px] text-neutral-400 mb-1">ممشى السيارة</label>
                            <input type="text" id="car-mileage" placeholder="مثال: 15,000 كم أو وكالة" required class="custom-input text-xs font-mono">
                        </div>
                        <div>
                            <label class="block text-[10px] text-neutral-400 mb-1">حالة السيارة (Tag)</label>
                            <select id="car-status-tag" class="custom-input text-xs" required>
                                <option value="متوفرة">متوفرة</option>
                                <option value="محجوزة">محجوزة</option>
                                <option value="مباعة">مباعة</option>
                                <option value="وصول قريب">وصول قريب</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[10px] text-neutral-400 mb-1">نوع الدفع / المحرك</label>
                            <input type="text" id="car-drive" placeholder="مثال: رباعي / V8 تيربو" class="custom-input text-xs">
                        </div>
                        <div>
                            <label class="block text-[10px] text-neutral-400 mb-1">روابط الصور (رابط واحد في كل سطر أو مفصول بفاصلة)</label>
                            <input type="text" id="car-images" placeholder="https://example.com/img1.jpg" required class="custom-input text-xs font-mono">
                        </div>
                    </div>

                    <div>
                        <label class="block text-[10px] text-neutral-400 mb-1">مواصفات وتفاصيل إضافية</label>
                        <textarea id="car-desc" rows="2" placeholder="اكتب المواصفات هنا..." class="custom-input text-xs resize-none"></textarea>
                    </div>

                    <div class="pt-2">
                        <button type="submit" id="save-btn" class="w-full py-3 bg-gradient-to-r from-[#d4af37] to-[#aa8c2c] text-black font-black text-xs rounded-xl shadow-lg hover:opacity-90 transition-all">
                            حفظ ونشر السيارة في المعرض
                        </button>
                    </div>
                </form>
            </div>

            <!-- قائمة السيارات المضافة -->
            <div class="card-box p-6 rounded-3xl border gold-border space-y-4">
                <h2 class="text-sm font-black text-white pb-3 border-b gold-border">إدارة السيارات المعروضة</h2>
                <div id="admin-cars-list" class="space-y-3">
                    <div class="text-center py-6 text-neutral-500 text-xs">جاري تحميل السيارات...</div>
                </div>
            </div>

        </main>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, set, push, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAwEcC_7ecjMxOdLJzT4cWnklapNSMMQjo",
            authDomain: "yam-stores.firebaseapp.com",
            databaseURL: "https://yam-stores-default-rtdb.firebaseio.com",
            projectId: "yam-stores",
            storageBucket: "yam-stores.firebasestorage.app",
            messagingSenderId: "337730969665",
            appId: "1:337730969665:web:dd865104af15846291a6c0",
            measurementId: "G-334MVEF7CR"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let allCars = {};
        let isMaintenanceOn = false;

        window.handleLogin = function(e) {
            e.preventDefault();
            const pass = document.getElementById('admin-pass').value;
            if (pass === "123456" || pass === "yam2026") {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-dashboard').classList.remove('hidden');
                initAdminData();
            } else {
                alert("كلمة المرور غير صحيحة!");
            }
        };

        window.logoutAdmin = function() {
            document.getElementById('admin-dashboard').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('admin-pass').value = '';
        };

        function initAdminData() {
            // جلب حالة الصيانة
            onValue(ref(db, 'settings/maintenance'), (snap) => {
                isMaintenanceOn = snap.val() === true;
                const btnText = document.getElementById('maintenance-text');
                const btn = document.getElementById('maintenance-btn');
                if (isMaintenanceOn) {
                    btnText.textContent = "الصيانة مفعلة حالياً";
                    btn.classList.add('border-amber-400', 'bg-amber-500/10');
                } else {
                    btnText.textContent = "وضع الصيانة معطل";
                    btn.classList.remove('border-amber-400', 'bg-amber-500/10');
                }
            });

            // جلب إجمالي الزيارات
            onValue(ref(db, 'statistics/totalVisits'), (snap) => {
                document.getElementById('stat-total-visits').textContent = (snap.val() || 0).toLocaleString();
            });

            // جلب مشاهدات السيارات وإجماليها
            onValue(ref(db, 'statistics/carViews'), (snap) => {
                const viewsData = snap.val() || {};
                let totalViews = Object.values(viewsData).reduce((a, b) => a + b, 0);
                document.getElementById('stat-car-views').textContent = totalViews.toLocaleString();
            });

            // جلب السيارات وإدارتها
            onValue(ref(db, 'products'), (snap) => {
                allCars = snap.val() || {};
                renderAdminCars();
            });
        }

        window.toggleMaintenance = function() {
            const newStatus = !isMaintenanceOn;
            set(ref(db, 'settings/maintenance'), newStatus).then(() => {
                alert(newStatus ? "تم تفعيل شاشة الصيانة على الموقع بنجاح!" : "تم إيقاف شاشة الصيانة وعمل الموقع طبيعياً!");
            });
        };

        window.saveCarData = function(e) {
            e.preventDefault();
            const editId = document.getElementById('edit-car-id').value;
            
            const rawImages = document.getElementById('car-images').value;
            const imagesArr = rawImages.split(',').map(img => img.trim()).filter(img => img.length > 0);

            const carData = {
                title: document.getElementById('car-title').value,
                price: Number(document.getElementById('car-price').value),
                marketType: document.getElementById('car-market').value,
                year: document.getElementById('car-year').value,
                mileage: document.getElementById('car-mileage').value,
                statusTag: document.getElementById('car-status-tag').value,
                driveType: document.getElementById('car-drive').value || 'رباعي',
                description: document.getElementById('car-desc').value,
                images: imagesArr,
                approved: true,
                createdAt: Date.now()
            };

            if (editId) {
                // تعديل سيارة موجودة
                update(ref(db, `products/${editId}`), carData).then(() => {
                    alert("تم تحديث بيانات السيارة بنجاح!");
                    resetCarForm();
                });
            } else {
                // إضافة سيارة جديدة
                const newRef = push(ref(db, 'products'));
                set(newRef, carData).then(() => {
                    alert("تمت إضافة السيارة ونشرها في المعرض بنجاح!");
                    resetCarForm();
                });
            }
        };

        function renderAdminCars() {
            const container = document.getElementById('admin-cars-list');
            const keys = Object.keys(allCars);
            
            document.getElementById('stat-total-cars').textContent = keys.length;

            if (keys.length === 0) {
                container.innerHTML = `<div class="text-center py-6 text-neutral-500 text-xs">لا توجد سيارات مسجلة حالياً.</div>`;
                return;
            }

            container.innerHTML = keys.map(k => {
                const car = allCars[k];
                const img = car.images?.[0] || 'https://placehold.co/200x150';
                return `
                    <div class="card-box p-3 rounded-2xl flex items-center justify-between gap-3 border gold-border">
                        <div class="flex items-center gap-3">
                            <img src="${img}" class="w-16 h-12 rounded-xl object-cover border gold-border shrink-0">
                            <div>
                                <h4 class="text-xs font-black text-white line-clamp-1">${car.title}</h4>
                                <span class="text-[10px] gold-text font-mono font-bold">${Number(car.price || 0).toLocaleString()} ﷼ | ممشى: ${car.mileage}</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-2 shrink-0">
                            <button onclick="editCar('${k}')" class="px-2.5 py-1.5 bg-neutral-900 border gold-border text-xs text-amber-300 rounded-xl hover:bg-[#d4af37] hover:text-black transition-all">
                                <i class="fa-solid fa-pen-to-square"></i> تعديل
                            </button>
                            <button onclick="deleteCar('${k}')" class="px-2.5 py-1.5 bg-red-500/10 border border-red-500/30 text-xs text-red-400 rounded-xl hover:bg-red-500 hover:text-white transition-all">
                                <i class="fa-solid fa-trash"></i> حذف
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.editCar = function(id) {
            const car = allCars[id];
            if (!car) return;

            document.getElementById('edit-car-id').value = id;
            document.getElementById('car-title').value = car.title || '';
            document.getElementById('car-price').value = car.price || '';
            document.getElementById('car-market').value = car.marketType || 'used';
            document.getElementById('car-year').value = car.year || '';
            document.getElementById('car-mileage').value = car.mileage || '';
            document.getElementById('car-status-tag').value = car.statusTag || 'متوفرة';
            document.getElementById('car-drive').value = car.driveType || '';
            document.getElementById('car-images').value = car.images ? car.images.join(', ') : '';
            document.getElementById('car-desc').value = car.description || '';

            document.getElementById('form-mode-title').textContent = "تعديل بيانات السيارة";
            document.getElementById('save-btn').textContent = "حفظ التعديلات";
            document.getElementById('cancel-edit-btn').classList.remove('hidden');

            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.resetCarForm = function() {
            document.getElementById('edit-car-id').value = '';
            document.querySelector('form').reset();
            document.getElementById('form-mode-title').textContent = "إضافة سيارة جديدة للمعرض";
            document.getElementById('save-btn').textContent = "حفظ ونشر السيارة في المعرض";
            document.getElementById('cancel-edit-btn').classList.add('hidden');
        };

        window.deleteCar = function(id) {
            if (confirm("هل أنت متأكد من حذف هذه السيارة نهائياً من المعرض؟")) {
                remove(ref(db, `products/${id}`)).then(() => {
                    alert("تم حذف السيارة بنجاح!");
                });
            }
        };
    </script>
</body>
</html>
