<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAM For Cars - معرض السيارات</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8f9fa; }
        .hero-section { background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=1920&q=80'); background-size: cover; background-position: center; color: white; padding: 100px 0; text-align: center; }
        .car-card { transition: transform 0.3s ease; border: none; border-radius: 15px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 25px; }
        .car-card:hover { transform: translateY(-5px); }
        .spec-badge { background-color: #e9ecef; color: #333; font-size: 0.85rem; padding: 5px 10px; border-radius: 8px; margin: 2px; display: inline-block; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#"><i class="fas fa-car-side text-warning me-2"></i>YAM For Cars</a>
            <div class="ms-auto">
                <a href="admin.html" class="btn btn-outline-warning btn-sm"><i class="fas fa-cog me-1"></i>لوحة الإدارة</a>
            </div>
        </div>
    </nav>

    <div class="hero-section">
        <div class="container">
            <h1 class="display-4 fw-bold mb-3">أفضل السيارات المتاحة بمعرضنا</h1>
            <p class="lead">اكتشف أحدث الموديلات بمواصفات دقيقة وأداء عالي</p>
        </div>
    </div>

    <div class="container my-5">
        <div class="row" id="carsContainer">
            <div class="text-center py-5">
                <div class="spinner-border text-warning" role="status"></div>
                <p class="mt-2 text-muted">جاري تحميل السيارات...</p>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCdvXcQMeQMDJ_mIZYRb17H5Po0UImeeNo",
            authDomain: "yam-for-cars.firebaseapp.com",
            projectId: "yam-for-cars",
            storageBucket: "yam-for-cars.firebasestorage.app",
            messagingSenderId: "935994947783",
            appId: "1:935994947783:web:6a436d7cd2d45319e4e6e2",
            measurementId: "G-C7VV63YKDL"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadCars() {
            const container = document.getElementById('carsContainer');
            try {
                const querySnapshot = await getDocs(collection(db, "cars"));
                let carsHTML = "";
                
                if (querySnapshot.empty) {
                    container.innerHTML = `<div class="col-12 text-center text-muted"><h4>لا توجد سيارات مضافة حالياً في المعرض.</h4></div>`;
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const car = doc.data();
                    carsHTML += `
                        <div class="col-md-4">
                            <div class="card car-card bg-white">
                                <img src="${car.image}" class="card-img-top" style="height: 200px; object-fit: cover;" alt="${car.name}">
                                <div class="card-body">
                                    <h5 class="card-title fw-bold">${car.name}</h5>
                                    <p class="text-primary fw-bold fs-5">${car.price}</p>
                                    <div class="mb-3">
                                        <span class="spec-badge"><i class="fas fa-engine text-secondary me-1"></i>${car.engine || 'غير متوفر'}</span>
                                        <span class="spec-badge"><i class="fas fa-horse text-danger me-1"></i>${car.hp || 'غير متوفر'}</span>
                                        <span class="spec-badge"><i class="fas fa-bolt text-warning me-1"></i>${car.torque || 'غير متوفر'}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = carsHTML;
            } catch (error) {
                console.error("Error loading cars: ", error);
                container.innerHTML = `<div class="col-12 text-center text-danger"><h4>حدث خطأ أثناء تحميل السيارات.</h4></div>`;
            }
        }

        loadCars();
    </script>
</body>
</html>
