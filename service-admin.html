<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الشركاء والورش | YAM FOR CARS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Cairo', sans-serif; background-color: #050505; color: white; -webkit-tap-highlight-color: transparent; }
        .gold-border { border-color: rgba(212, 175, 55, 0.3); }
        .gold-text { color: #d4af37; }
        .card-box {
            background: linear-gradient(145deg, #0d0d0d, #060606);
            border: 1px solid rgba(255, 255, 255, 0.07);
            box-shadow: 0 15px 35px -10px rgba(0, 0, 0, 0.9);
        }
        .custom-input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 14px;
            background-color: #121212;
            border: 1px solid rgba(212, 175, 55, 0.25);
            color: white;
            font-size: 13px;
            outline: none;
            transition: all 0.3s ease;
        }
        .custom-input:focus {
            border-color: #d4af37;
            box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.15);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-[#d4af37] selection:text-black">

    <!-- شاشة تسجيل دخول الورشة -->
    <div id="service-login-screen" class="fixed inset-0 z-50 bg-black flex items-center justify-center p-4">
        <div class="card-box p-8 rounded-3xl border gold-border w-full max-w-sm text-center space-y-6 shadow-2xl">
            <div class="w-20 h-20 bg-[#d4af37]/10 border gold-border rounded-2xl flex items-center justify-center mx-auto text-[#d4af37] text-3xl shadow-inner">
                <i class="fa-solid fa-store"></i>
            </div>
            <div>
                <h1 class="text-xl font-black text-white">بوابة الشركاء والورش</h1>
                <p class="text-xs text-neutral-400 mt-1">أدخل كود متجرك أو ورشتك الخاص</p>
            </div>
            <form onsubmit="handleServiceLogin(event)" class="space-y-4">
                <input type="text" id="store-code" placeholder="كود المتجر (مثال: -Oabc123)" required class="custom-input text-center font-mono text-xs">
                <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-[#d4af37] to-[#aa8c2c] text-black font-black text-sm rounded-xl hover:opacity-90 transition-all shadow-lg">
                    دخول لوحة الورشة
                </button>
            </form>
        </div>
    </div>

    <!-- لوحة تحكم الورشة -->
    <div id="service-dashboard" class="flex-1 flex flex-col hidden">
        <header class="bg-black/95 border-b gold-border h-16 px-4 sm:px-8 flex items-center justify-between sticky top-0 z-40 backdrop-blur-md">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-[#d4af37]/10 border gold-border flex items-center justify-center text-[#d4af37]">
                    <i class="fa-solid fa-wrench"></i>
                </div>
                <div>
                    <span id="header-store-name" class="text-xs sm:text-sm font-black tracking-wider block text-amber-300">اسم الورشة</span>
                    <span class="text-[9px] text-neutral-400 tracking-widest block">بوابة إدارة الخدمات والأسعار</span>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="serviceLogout()" class="px-3 py-2 bg-neutral-900 border gold-border text-neutral-300 hover:text-red-400 text-xs font-bold rounded-xl transition-all">
                    <i class="fa-solid fa-right-from-bracket"></i> خروج
                </button>
            </div>
        </header>

        <main class="flex-1 max-w-2xl mx-auto w-full p-4 sm:p-6 space-y-6 my-auto">
            <div class="card-box p-6 rounded-3xl border gold-border space-y-4">
                <div class="flex items-center justify-between pb-3 border-b gold-border">
                    <h2 class="text-sm font-black text-white">تعديل بيانات ورشتك أو مركزك</h2>
                    <span class="text-[10px] gold-text font-mono">YAM FOR CARS Partner</span>
                </div>
                
                <form onsubmit="updateServiceData(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs text-neutral-400 mb-1">اسم المركز / الورشة</label>
                        <input type="text" id="edit-s-name" required class="custom-input">
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs text-neutral-400 mb-1">رقم الجوال / الواتساب</label>
                            <input type="text" id="edit-s-phone" required class="custom-input font-mono">
                        </div>
                        <div>
                            <label class="block text-xs text-neutral-400 mb-1">المنطقة / الموقع</label>
                            <input type="text" id="edit-s-location" required class="custom-input">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs text-neutral-400 mb-1">الخدمات والاختصاصات ومواعيد العمل</label>
                        <textarea id="edit-s-desc" rows="3" required class="custom-input"></textarea>
                    </div>
                    <button type="submit" class="w-full py-3 bg-[#d4af37] text-black font-black rounded-xl text-xs shadow-lg hover:opacity-90 transition-all">
                        حفظ التعديلات وتحديثها فوراً بالموقع
                    </button>
                </form>
            </div>
        </main>
    </div>

    <footer class="bg-black text-neutral-500 py-3 border-t gold-border text-center text-[11px] font-mono shrink-0">
        YAM FOR CARS Partner Portal © 2026
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAwEcC_7ecjMxOdLJzT4cWnklapNSMMQjo",
            authDomain: "yam-stores.firebaseapp.com",
            databaseURL: "https://yam-stores-default-rtdb.firebaseio.com",
            projectId: "yam-stores",
            storageBucket: "yam-stores.firebasestorage.app",
            messagingSenderId: "337730969665",
            appId: "1:337730969665:web:dd865104af15846291a6c0",
            measurementId: "G-334MVEF7CR"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentStoreCode = null;

        window.addEventListener('DOMContentLoaded', () => {
            const savedCode = sessionStorage.getItem('yam_store_code');
            if (savedCode) {
                currentStoreCode = savedCode;
                loadStoreData(savedCode);
            }
        });

        window.handleServiceLogin = async function(e) {
            e.preventDefault();
            const code = document.getElementById('store-code').value.trim();
            
            try {
                const snap = await get(ref(db, `services/${code}`));
                if (snap.exists()) {
                    sessionStorage.setItem('yam_store_code', code);
                    currentStoreCode = code;
                    loadStoreData(code);
                } else {
                    alert('كود المتجر غير صحيح أو غير مسجل في قاعدة البيانات!');
                }
            } catch(err) {
                alert('حدث خطأ في الاتصال بقاعدة البيانات.');
            }
        };

        async function loadStoreData(code) {
            try {
                const snap = await get(ref(db, `services/${code}`));
                if (snap.exists()) {
                    const data = snap.val();
                    document.getElementById('edit-s-name').value = data.name || '';
                    document.getElementById('edit-s-phone').value = data.phone || '';
                    document.getElementById('edit-s-location').value = data.location || '';
                    document.getElementById('edit-s-desc').value = data.description || '';
                    document.getElementById('header-store-name').textContent = data.name || 'ورشة الشريك';

                    document.getElementById('service-login-screen').classList.add('hidden');
                    document.getElementById('service-dashboard').classList.remove('hidden');
                }
            } catch(err) {}
        }

        window.updateServiceData = async function(e) {
            e.preventDefault();
            if (!currentStoreCode) return;

            const updatedData = {
                name: document.getElementById('edit-s-name').value.trim(),
                phone: document.getElementById('edit-s-phone').value.trim(),
                location: document.getElementById('edit-s-location').value.trim(),
                description: document.getElementById('edit-s-desc').value.trim()
            };

            try {
                await update(ref(db, `services/${currentStoreCode}`), updatedData);
                alert('تم تحديث بيانات الورشة بنجاح!');
                document.getElementById('header-store-name').textContent = updatedData.name;
            } catch(err) {
                alert('حدث خطأ أثناء الحفظ.');
            }
        };

        window.serviceLogout = function() {
            sessionStorage.removeItem('yam_store_code');
            location.reload();
        };
    </script>
</body>
</html>
