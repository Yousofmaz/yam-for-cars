<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل خدمات السيارات | YAM SERVICES</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #050505; color: white; -webkit-tap-highlight-color: transparent; }
        .gold-border { border-color: rgba(212, 175, 55, 0.3); }
        .gold-text { color: #d4af37; }
        .card-box {
            background: linear-gradient(145deg, #0d0d0d, #060606);
            border: 1px solid rgba(255, 255, 255, 0.07);
            box-shadow: 0 15px 35px -10px rgba(0, 0, 0, 0.9);
            transition: all 0.3s ease;
        }
        .card-box:hover { border-color: rgba(212, 175, 55, 0.6); transform: translateY(-3px); }
        .custom-input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 14px;
            background-color: #121212;
            border: 1px solid rgba(212, 175, 55, 0.25);
            color: white;
            font-size: 13px;
            outline: none;
        }
        .custom-input:focus { border-color: #d4af37; box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.15); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-[#d4af37] selection:text-black">

    <!-- الهيدر -->
    <header class="bg-black/95 border-b gold-border h-20 px-4 sm:px-8 flex items-center justify-between sticky top-0 z-40 backdrop-blur-md">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-2xl bg-[#d4af37]/10 border gold-border flex items-center justify-center text-[#d4af37] text-xl shadow-inner">
                <i class="fa-solid fa-wrench"></i>
            </div>
            <div>
                <span class="text-sm sm:text-base font-black tracking-wider block">YAM SERVICES</span>
                <span class="text-[10px] gold-text font-semibold tracking-widest block">دليل خدمات وعناية السيارات</span>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <a href="index.html" class="px-3.5 py-2 rounded-xl bg-neutral-900 border gold-border text-neutral-300 hover:text-white text-xs font-bold transition-all flex items-center gap-2">
                <i class="fa-solid fa-car"></i> عودة لمعرض السيارات
            </a>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="flex-1 max-w-6xl mx-auto w-full p-4 sm:p-6 space-y-6 my-6">
        
        <!-- قسم الترحيب والفلاتر -->
        <div class="text-center space-y-3 py-4">
            <h1 class="text-2xl sm:text-4xl font-black text-white">دليل الورش ومراكز الخدمة المعتمدة</h1>
            <p class="text-xs sm:text-sm text-neutral-400 max-w-xl mx-auto">أفضل ورش الصيانة، مراكز التلميع، السطحات، وقطع الغيار الموثوقة لخدمتك.</p>
            
            <!-- أزرار التصفية (الأقسام) -->
            <div class="flex flex-wrap justify-center gap-2 pt-3" id="category-filters">
                <button onclick="filterCategory('all')" class="cat-btn px-4 py-2 rounded-xl bg-[#d4af37] text-black text-xs font-black transition-all">الكل</button>
                <button onclick="filterCategory('workshop')" class="cat-btn px-4 py-2 rounded-xl bg-neutral-900 border gold-border text-neutral-300 text-xs font-bold transition-all">ورش ميكانيكا وكهرباء</button>
                <button onclick="filterCategory('detailing')" class="cat-btn px-4 py-2 rounded-xl bg-neutral-900 border gold-border text-neutral-300 text-xs font-bold transition-all">تلميع وعناية</button>
                <button onclick="filterCategory('towing')" class="cat-btn px-4 py-2 rounded-xl bg-neutral-900 border gold-border text-neutral-300 text-xs font-bold transition-all">سطحات ونقل</button>
                <button onclick="filterCategory('parts')" class="cat-btn px-4 py-2 rounded-xl bg-neutral-900 border gold-border text-neutral-300 text-xs font-bold transition-all">قطع غيار</button>
            </div>
        </div>

        <!-- قائمة الخدمات -->
        <div id="services-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
            <div class="col-span-full text-center text-neutral-500 py-12 text-xs">جاري تحميل الخدمات...</div>
        </div>

    </main>

    <!-- الفوتر -->
    <footer class="bg-black text-neutral-500 py-6 border-t gold-border text-center text-xs font-mono space-y-1">
        <p>YAM FOR CARS & SERVICES Directory © 2026</p>
        <p class="text-[10px] text-neutral-600">شريكك الموثوق في عالم السيارات</p>
    </footer>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAwEcC_7ecjMxOdLJzT4cWnklapNSMMQjo",
            authDomain: "yam-stores.firebaseapp.com",
            databaseURL: "https://yam-stores-default-rtdb.firebaseio.com",
            projectId: "yam-stores",
            storageBucket: "yam-stores.firebasestorage.app",
            messagingSenderId: "337730969665",
            appId: "1:337730969665:web:dd865104af15846291a6c0",
            measurementId: "G-334MVEF7CR"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let allServices = {};
        let currentFilter = 'all';

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const snap = await get(ref(db, 'services'));
                allServices = snap.val() || {};
                renderServices(allServices);
            } catch(e) {
                document.getElementById('services-grid').innerHTML = `<p class="col-span-full text-center text-red-400 text-xs">حدث خطأ أثناء تحميل البيانات.</p>`;
            }
        });

        window.filterCategory = function(cat) {
            currentFilter = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('bg-[#d4af37]', 'text-black', 'font-black');
                btn.classList.add('bg-neutral-900', 'border', 'gold-border', 'text-neutral-300', 'font-bold');
            });
            event.target.classList.remove('bg-neutral-900', 'border', 'gold-border', 'text-neutral-300', 'font-bold');
            event.target.classList.add('bg-[#d4af37]', 'text-black', 'font-black');

            if (cat === 'all') {
                renderServices(allServices);
            } else {
                let filtered = {};
                Object.keys(allServices).forEach(k => {
                    if (allServices[k].category === cat) filtered[k] = allServices[k];
                });
                renderServices(filtered);
            }
        };

        function renderServices(data) {
            const grid = document.getElementById('services-grid');
            const keys = Object.keys(data);

            if (keys.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-neutral-500 py-12 text-xs card-box rounded-2xl">لا توجد خدمات مسجلة في هذا القسم حالياً.</p>`;
                return;
            }

            const catNames = {
                'workshop': 'ورش ميكانيكا وكهرباء',
                'detailing': 'تلميع وعناية',
                'towing': 'سطحات ونقل',
                'parts': 'قطع غيار'
            };

            grid.innerHTML = keys.map(k => {
                const s = data[k];
                const cleanPhone = s.phone ? s.phone.replace(/[^0-9]/g, '') : '966554082283';
                return `
                    <div class="card-box rounded-3xl p-5 flex flex-col justify-between space-y-4 border gold-border">
                        <div class="space-y-2">
                            <div class="flex items-center justify-between">
                                <span class="text-[10px] font-bold px-2.5 py-1 rounded-lg bg-[#d4af37]/10 text-[#d4af37] border gold-border">${catNames[s.category] || 'خدمة'}</span>
                                <span class="text-[11px] text-neutral-400 font-mono"><i class="fa-solid fa-location-dot gold-text ml-1"></i>${s.location || 'غير محدد'}</span>
                            </div>
                            <h3 class="text-base font-black text-white">${s.name}</h3>
                            <p class="text-xs text-neutral-400 leading-relaxed">${s.description || 'لا توجد ملاحظات إضافية.'}</p>
                        </div>

                        <div class="grid grid-cols-2 gap-2 pt-2 border-t border-neutral-900">
                            <a href="tel:${s.phone}" class="py-2.5 bg-neutral-900 border gold-border text-center text-xs font-bold text-white rounded-xl hover:bg-neutral-800 transition-all flex items-center justify-center gap-1.5">
                                <i class="fa-solid fa-phone text-[#d4af37]"></i> اتصال
                            </a>
                            <a href="https://wa.me/${cleanPhone}?text=مرحباً، استفسرت عن خدمتكم عبر دليل YAM Services" target="_blank" class="py-2.5 bg-[#d4af37] text-black text-center text-xs font-black rounded-xl hover:opacity-90 transition-all flex items-center justify-center gap-1.5 shadow">
                                <i class="fa-brands fa-whatsapp text-sm"></i> واتساب
                            </a>
                        </div>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
